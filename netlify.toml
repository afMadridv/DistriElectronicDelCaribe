# Netlify — Portal DistriElectronicDelCaribe
# Sitio estático: se publica la carpeta portal/ tal cual.
[build]
  publish = "portal"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # el micrófono se permite solo al propio portal (llamadas)
    Permissions-Policy = "geolocation=(), microphone=(self), camera=()"

# el Service Worker y el manifiesto siempre se revisan (versiones nuevas)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "no-cache, max-age=0, must-revalidate"
